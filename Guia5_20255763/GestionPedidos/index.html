<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pedidos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


</head>

<body class="bg-light text-dark">

    <nav class="navbar navbar-light bg-white shadow-sm mb-4">
        <div class="container-fluid justify-content-center">
            <span class="navbar-brand mb-0 h1 fw-bold">
                Gestión de pedidos
            </span>
        </div>
    </nav>

    <main class="container py-3">

        <h1 class="h3 fw-bold mb-4">Panel de pedidos</h1>

        <div class="row gx-5 gy-4 align-items-start">

            <section class="col-12 col-lg-8 me-lg-4 bg-white border rounded p-3 p-md-4 shadow-sm">

                <h2 class="h5 fw-bold mb-4">Pedidos registrados</h2>

                <div class="row g-2 align-items-end mb-4">

                    <div class="col-12 col-sm">
                        <label for="precioMaximo" class="form-label fw-semibold text-secondary small">
                            Precio máximo ($)
                        </label>

                        <input type="number" id="precioMaximo" class="form-control" min="0.01" step="0.01"
                            placeholder="Ej. 5.00">
                    </div>

                    <div class="col-auto">
                        <button type="button" id="btnFiltrar" class="btn btn-outline-primary fw-medium">
                            Filtrar productos
                        </button>
                    </div>

                    <div class="col-auto">
                        <button type="button" id="btnMostrarTodos" class="btn btn-outline-secondary fw-medium">
                            Mostrar todos
                        </button>
                    </div>

                </div>

                <div class="table-responsive border rounded mb-4">
                    <table class="table table-striped table-hover align-middle mb-0">

                        <thead class="table-light">
                            <tr>
                                <th>Producto</th>
                                <th>Precio unitario</th>
                                <th>Cantidad</th>
                                <th>Subtotal</th>
                            </tr>
                        </thead>

                        <tbody id="tablaPedidos">
                            <!-- Los pedidos se agregarán con JS -->
                        </tbody>

                    </table>
                </div>

                <div class="row g-3">

                    <div class="col-12 col-sm-6">
                        <div class="bg-light border rounded p-3">
                            <p class="text-secondary small fw-medium mb-1">Total de unidades</p>
                            <h3 id="totalUnidades" class="fw-bold mb-0">0</h3>
                        </div>
                    </div>

                    <div class="col-12 col-sm-6">
                        <div class="bg-light border rounded p-3">
                            <p class="text-secondary small fw-medium mb-1">Monto total</p>
                            <h3 id="montoTotal" class="fw-bold mb-0">$0.00</h3>
                        </div>
                    </div>

                </div>

                <button type="button" id="btnLimpiar" class="btn btn-outline-danger fw-medium mt-4">
                    Limpiar pedidos
                </button>

            </section>

            <aside class="col-12 col-lg-3 bg-white border rounded p-3 p-md-4 shadow-sm">

                <h2 class="h5 fw-bold mb-4">Agregar pedido</h2>

                <form id="formPedido">

                    <div class="mb-3">
                        <label for="nombreProducto" class="form-label fw-semibold text-secondary small">
                            Nombre del producto
                        </label>

                        <input type="text" id="nombreProducto" name="producto" class="form-control"
                            placeholder="Ej. Café americano" required>
                    </div>

                    <div class="mb-3">
                        <label for="precioProducto" class="form-label fw-semibold text-secondary small">
                            Precio unitario ($)
                        </label>

                        <input type="number" id="precioProducto" name="precio" class="form-control" step="0.01"
                            placeholder="Ej. 2.50" required>
                    </div>

                    <div class="mb-3">
                        <label for="cantidadProducto" class="form-label fw-semibold text-secondary small">
                            Cantidad solicitada
                        </label>

                        <input type="number" id="cantidadProducto" name="cantidad" class="form-control"
                            placeholder="Ej. 3" required>
                    </div>

                    <button type="submit" id="btnAgregar" class="btn btn-primary w-100 py-2 fw-bold shadow-sm mb-2">
                        + Agregar pedido
                    </button>

                    <button type="reset" class="btn btn-light border w-100 py-2 fw-medium text-secondary">
                        Limpiar formulario
                    </button>

                </form>

            </aside>

        </div>

    </main>

    <script src="js/pedidos.js"></script>

</body>

</html>
